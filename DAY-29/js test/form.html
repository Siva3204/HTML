<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpage</title>
    <style>
        input{
            border:3px solid rgb(21, 20, 20);
            height:50px;
            width:500px;
            
        }
        #button{
            height:50px;
            width:510px;
            text-align: center;
            margin-top:3%;
        }
    </style>
</head>
<body>
    <h2>poster-builder</h2>
    <input type="file" id="file" required><br />
    <label for="title">title:</label><br />
    <input type="text" id="text" placeholder="enter your title" required><br />
    <label for="description">description:</label><br />
    <input type="text"  id="description" placeholder="enter your description" required><br />
    <label for="date">date:</label><br />
    <input type="date" id="date" placeholder="enter your date" required><br />
    <label for="author's name">author's name:</label><br />
    <input type="text" id="author" placeholder="enter your author's name" required><br />
    <button type="submit" id="button" name="submit">submit</button>
    <script src="form.js"></script>
</body>
</html>
