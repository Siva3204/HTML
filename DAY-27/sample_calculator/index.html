<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="sample.css">

</head>
<body>
    <div class="container">
        <h2>Sample calculator</h2>
        <input type="number" name="display"><br/><br/>

        <button type="submit">-</button>
        <button type="submit">*</button>
        <button type="submit">/</button>
        <button type="submit">%</button><br/><br/>
        <input type="equal to" value="=" onclick="display.values='='">
    </div>
