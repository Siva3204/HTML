<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1 id="k1">weather-report</h1> 
   <div class="container">
    <div class="row">
      <input type="text" id="display">
      <button type="search" id="search">search</button>
    </div>
    <div class="row1">
        <h2 id="country">New york</h2>
        <img id="a1" src="https://cdn-icons-png.flaticon.com/512/5421/5421273.png" alt="" height="130" width="150">
        <h1 id="temp">23℃ </h1>
        <p class="cloud">Heavy Intense Rain</p>
    </div>
        <div class="row2">
            <main>
            <img id="a2" src="https://weatherapp-via-city.netlify.app/images/pngwing.com.png" alt="humidity" height="60" width="90">
            <h3 class="cloud1">90%</h3>
            <p>humidity</p>
           </main>
           <nav>
            <img id="a3" src="https://cdn3.iconfinder.com/data/icons/feather-5/24/wind-1024.png" alt="speed" height="60" width="90">
            <h3 class="cloud1">90 km/h</h3>
            <p>wind speed</p>
           </nav>
        </div>
    
</div>
<script src="main.js"></script>
</body>
</html>
