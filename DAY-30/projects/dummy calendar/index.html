<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calendar</h1>
    <div class="container">
        <div class="month">
            <button id="prevMonth">prev</button>
            <h2 id="monthYear">December 2024</h2>
            <button id="nextMonth">next</button>
        </div>
        <div class="weeks">
            <ul>
                <li>Sun</li>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>
                <li>Sat</li>
            </ul>
        </div>
        <div class="days">
            <ul class="numbers" id="calendarDays">
                </ul>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
