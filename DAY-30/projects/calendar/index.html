<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calendar</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <h1>calendar</h1>
    <div class="container">
        <div class="month">
            <button type="submit" id="prev">prev</button>
            <h2 id="monthyear">December 2024</h2>
            <button type="submit" id="next">next</button>
        </div>
        <div class="weeks">
            <ul>
                <li>Sun</li>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>
                <li>Sat</li>
            </ul>
        </div>
        <div class="days">
            <ul class="numbers">
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
                <li>5</li>
                <li>6</li>
                <li>7</li>
                <li>8</li>
                <li>9</li>    
                <li>10</li>
                <li>11</li>
                <li>12</li>   
            </ul>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
