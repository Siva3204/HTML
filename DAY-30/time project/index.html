<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>stop-watch time</h1>
    <div class="container">
         <div class="clock">
                <span id="hrs">00</span>
                <span>:</span>
                <span id="min">00</span>
                <span>:</span>
                <span id="sec">00</span>
            </div>
          <div class="btn">
                <button type="submit" id="start" onclick="start()">start</button>
                <button type="submit" id="pause">pause</button>
                <button type="submit" id="stop" onclick="stop()">stop</button>
          </div>
   </div>
   <script src="main.js"></script>
</body>
</html>
