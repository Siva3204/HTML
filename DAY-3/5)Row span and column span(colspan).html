<html>
    <head>
        <title>create tables</title>
        <style>
            table,td,th{
                font-size: 40px;
                border:1px solid blue;
                padding: 20px;
                border-collapse:collapse;
                color:red;
                 background-color:pink;     
                }
        </style>
    </head>
    <body>
        <h1>colspan(column span)</h1>
        <table style= "width:70%">
            <tr>
                <th colspan="2">S.NO</th>
                <th>roll no</th>
                
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                </tr>
                <tr>            
                    <td>2</td>
                    <td>18</td>
                    <td>15</td>
            </tr>
            <table>
                <h1><u>rowspan</u> using for <u>col(column)</u></h1>
                <tr>
                    <th>s.no</th>
                    <th>age</th>
                    <th>roll no</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td rowspan="2">2</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>4</td>
                    <td>5</td>
                </tr>
                <table>
                    <h1>I think<br/> <u>colspan</u> using for <u>rows</u></h1>
                    <tr>
                    <th>s.no</th>
                    <th>age</th>
                    <th>roll no</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td colspan="2">2</td>
                        </tr>
                        <tr>
                        <td>3</td>
                        <td>4</td>
                        <td>5</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>4</td>
                            <td>5</td>
                        </tr>
                        <table>
                          <tr>
                                <th>S.no</th>
                                <th >roll no</th>
                                <th>age</th>
                                </tr>
                                <tr>
                                <td>1</td>
                                <td rowspan="3" colspan="2">2</td>
                                </tr>
                                <tr>
                                    <td>3</td>
                            
                                   </tr>
                                <tr>
                                    <td>3</td>
            
                                </tr>
                            </tr>
                        </table>

                    </table>
                </table>
            </table>
        </table>
    </body>
    </html>
